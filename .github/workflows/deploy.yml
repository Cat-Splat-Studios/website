name: Deploy to GitHub Pages

# The site is plain HTML/CSS/JS with no dependencies and no build step, so this
# workflow just uploads the `site/` directory as-is. Nothing to install, nothing
# to compile, nothing for Dependabot to flag.

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Nothing compiles here, so this is the only thing standing between a
      # broken link (or a nav updated on four pages out of five) and production.
      # Standard library only, and the runner already has Python.
      - name: Check the site
        run: python tools/check.py

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./site"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
