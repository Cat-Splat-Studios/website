<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Hit resolver assertions</title>
    <style>
      body { background: #100d14; color: #cfc6dc; font: 14px/1.6 ui-monospace, monospace; padding: 2rem; }
      h1 { font-size: 1.2rem; color: #ffae3a; }
      table { border-collapse: collapse; margin-top: 1rem; width: 100%; }
      th, td { text-align: left; padding: 0.3rem 0.7rem; border-bottom: 1px solid #2a2533; }
      th { color: #8a8397; font-weight: 400; }
      .pass { color: #7ec88a; }
      .fail { color: #ff6a2a; font-weight: 700; }
      #summary { margin-top: 1.5rem; font-size: 1.05rem; }
    </style>
  </head>
  <body>
    <h1>Hit resolver: all 48 combinations</h1>
    <p>
      This page never ships. It exercises the same pure function the site uses, so a wrong
      branch shows up here rather than in front of a visitor. Open it directly and read the
      summary at the bottom.
    </p>
    <div id="out"></div>
    <p id="summary"></p>

    <!-- The site script exposes window.csResolveHit. Its DOM work is all guarded
         by querySelector checks, so loading it here is inert. -->
    <script src="../site/assets/js/site.js"></script>
    <script>
      const STATES = ["grounded", "airborne", "juggled"];
      const rows = [];
      let pass = 0;
      let fail = 0;

      // An independent restatement of the contract, written from the step list
      // rather than from the implementation, so a copied bug does not agree
      // with itself.
      function expected({ state, meterFull, ready, armor, lethal }) {
        const airborne = state !== "grounded";
        const meterSurvives = meterFull && !(airborne && state === "juggled");
        if (ready) return "Executed";
        if (lethal) return "Dead";
        if (meterSurvives) return "Launched";
        if (armor) return "Armor absorbs it. No flinch.";
        return "Hitstun";
      }

      for (const state of STATES) {
        for (const meterFull of [false, true]) {
          for (const ready of [false, true]) {
            for (const armor of [false, true]) {
              for (const lethal of [false, true]) {
                const input = { state, meterFull, ready, armor, lethal };
                const got = window.csResolveHit(input);
                const want = expected(input);
                const ok = got.outcome === want;
                ok ? pass++ : fail++;

                // Invariants that must hold for every combination.
                const steps = got.steps;
                const notes = [];
                for (let i = 1; i <= 6; i++) {
                  if (steps[i] !== "is-run" && steps[i] !== "is-half") {
                    notes.push(`step ${i} should always run`);
                  }
                }
                if (state === "grounded" && steps[3] !== "is-run") notes.push("step 3 should run when grounded");
                if (state !== "grounded" && steps[3] !== "is-half") notes.push("step 3 should be half when airborne");
                if (notes.length) fail++, pass--;

                rows.push(
                  `<tr><td>${state}</td><td>${meterFull ? "meter" : ""}</td><td>${ready ? "ready" : ""}</td>` +
                    `<td>${armor ? "armor" : ""}</td><td>${lethal ? "lethal" : ""}</td>` +
                    `<td>${got.outcome}</td><td>${got.last}</td>` +
                    `<td class="${ok && !notes.length ? "pass" : "fail"}">${
                      ok && !notes.length ? "pass" : "FAIL " + (notes.join("; ") || `expected ${want}`)
                    }</td></tr>`
                );
              }
            }
          }
        }
      }

      document.getElementById("out").innerHTML =
        '<table><thead><tr><th>state</th><th>meter</th><th>ready</th><th>armor</th><th>lethal</th>' +
        "<th>outcome</th><th>last step</th><th>result</th></tr></thead><tbody>" +
        rows.join("") +
        "</tbody></table>";

      document.getElementById("summary").innerHTML =
        fail === 0
          ? `<span class="pass">All ${pass} combinations pass.</span>`
          : `<span class="fail">${fail} failing, ${pass} passing.</span>`;
    </script>
  </body>
</html>
